name: Automated Release Workflow

on:
  pull_request:
    types: [closed]
    branches:
      - main

# Releases mutate main (version bump + changelog) and claim a version number,
# so only one may be in flight at a time. Queue rather than cancel: every merged
# PR still gets its own release.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # =============================================================================
  # PRE-CHECK: Determine if release should run
  # Skip release for: skip-release label, or CI/docs-only changes
  # =============================================================================
  check:
    name: "Pre-check: Should Release?"
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      contents: read

    outputs:
      should_release: ${{ steps.decision.outputs.should_release }}
      skip_reason: ${{ steps.decision.outputs.skip_reason }}

    steps:
      - name: Check for skip-release label
        id: check_label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "Labels: $LABELS"
          if echo "$LABELS" | grep -q "skip-release"; then
            echo "has_skip_label=true" >> $GITHUB_OUTPUT
            echo "Found 'skip-release' label"
          else
            echo "has_skip_label=false" >> $GITHUB_OUTPUT
            echo "No 'skip-release' label found"
          fi

          # Counterpart to skip-release: release even though the auto-skip rule
          # below would have passed on this PR. For a pipeline or docs change
          # that still needs to reach users as a release.
          if echo "$LABELS" | grep -q "force-release"; then
            echo "has_force_label=true" >> $GITHUB_OUTPUT
            echo "Found 'force-release' label"
          else
            echo "has_force_label=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: changed_files
        uses: dorny/paths-filter@v3
        with:
          filters: |
            release_worthy:
              - '!.github/**'
              - '!**.md'
              - '!.gitignore'
              - '!.editorconfig'
              - '!LICENSE'

      - name: Determine if release should proceed
        id: decision
        run: |
          HAS_SKIP_LABEL="${{ steps.check_label.outputs.has_skip_label }}"
          HAS_FORCE_LABEL="${{ steps.check_label.outputs.has_force_label }}"
          HAS_RELEASE_WORTHY_CHANGES="${{ steps.changed_files.outputs.release_worthy }}"

          echo "Skip label present: $HAS_SKIP_LABEL"
          echo "Force label present: $HAS_FORCE_LABEL"
          echo "Has release-worthy changes: $HAS_RELEASE_WORTHY_CHANGES"

          # skip-release wins over force-release, so an explicit "do not ship"
          # is never overridden by the escape hatch.
          if [ "$HAS_SKIP_LABEL" = "true" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "skip_reason=PR has 'skip-release' label" >> $GITHUB_OUTPUT
            echo "::notice::Skipping release: PR has 'skip-release' label"
          elif [ "$HAS_FORCE_LABEL" = "true" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "skip_reason=" >> $GITHUB_OUTPUT
            echo "::notice::Proceeding with release: PR has 'force-release' label"
          elif [ "$HAS_RELEASE_WORTHY_CHANGES" = "false" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "skip_reason=Only CI/docs files changed (.github/**, *.md, etc.)" >> $GITHUB_OUTPUT
            echo "::notice::Skipping release: Only CI/docs files changed"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "skip_reason=" >> $GITHUB_OUTPUT
            echo "::notice::Proceeding with release"
          fi

      - name: Summary
        run: |
          echo "## Pre-check: Release Decision" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.decision.outputs.should_release }}" = "true" ]; then
            echo "✅ **Proceeding with release**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Skipping release**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** ${{ steps.decision.outputs.skip_reason }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "- Skip label present: \`${{ steps.check_label.outputs.has_skip_label }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Force label present: \`${{ steps.check_label.outputs.has_force_label }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Release-worthy changes: \`${{ steps.changed_files.outputs.release_worthy }}\`" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # STAGE 1: PREPARE
  # Environment setup and version detection
  # =============================================================================
  prepare:
    name: "Stage 1: Prepare"
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      version_type: ${{ steps.version_type.outputs.type }}

    steps:
      - name: Detect version bump type
        id: version_type
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "Labels: $LABELS"

          if echo "$LABELS" | grep -q "version:major"; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "Detected: MAJOR version bump"
          elif echo "$LABELS" | grep -q "version:minor"; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "Detected: MINOR version bump"
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "Detected: PATCH version bump (default)"
          fi

      - name: Stage Summary
        run: |
          echo "## Stage 1: Prepare" >> $GITHUB_STEP_SUMMARY
          echo "- Version bump type: **${{ steps.version_type.outputs.type }}**" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # STAGE 2: BUILD
  # Version bump, changelog generation, and extension build
  # =============================================================================
  build:
    name: "Stage 2: Build"
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.bump_version.outputs.version }}
      zip_file: ${{ steps.build.outputs.zip_file }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # main, not the run's trigger SHA. A queued release must bump from the
          # version that is on main now, or two releases claim the same number.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump_version
        run: |
          echo "Using the runner's Node: $(node --version) (npm $(npm --version))"
          PREVIOUS_VERSION=$(node -p "require('./manifest.json').version")
          node .github/scripts/bump-version.js ${{ needs.prepare.outputs.version_type }}
          NEW_VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version: $PREVIOUS_VERSION -> $NEW_VERSION (${{ needs.prepare.outputs.version_type }} bump)"

      - name: Update CHANGELOG
        env:
          VERSION: ${{ steps.bump_version.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Sizes only - the script itself logs the shape of each input. This
          # runs before node so an input problem is visible even if node never
          # starts.
          echo "::group::Changelog step inputs"
          echo "VERSION   : '${VERSION}' (${#VERSION} chars)"
          echo "PR_TITLE  : ${#PR_TITLE} chars"
          echo "PR_BODY   : ${#PR_BODY} chars, $(printf '%s' "${PR_BODY}" | wc -l) newlines"
          echo "PR_NUMBER : '${PR_NUMBER}'"
          echo "PR_AUTHOR : '${PR_AUTHOR}'"
          echo "::endgroup::"

          node .github/scripts/generate-changelog.js

          echo "::group::CHANGELOG.md diff"
          git --no-pager diff --stat -- CHANGELOG.md
          git --no-pager diff -- CHANGELOG.md | head -80
          echo "::endgroup::"

      - name: Build extension zip
        id: build
        run: |
          node .github/scripts/build-extension.js
          ZIP_FILE="Cap-screen-v${{ steps.bump_version.outputs.version }}.zip"
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "Built: $ZIP_FILE"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            manifest.json
            CHANGELOG.md
            Cap-screen-v${{ steps.bump_version.outputs.version }}.zip
          retention-days: 1

      - name: Stage Summary
        run: |
          echo "## Stage 2: Build" >> $GITHUB_STEP_SUMMARY
          echo "- New version: **v${{ steps.bump_version.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Extension ZIP: \`${{ steps.build.outputs.zip_file }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Build diagnostics on failure
        if: failure()
        env:
          VERSION: ${{ steps.bump_version.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "::group::Environment"
          echo "node: $(node --version), npm: $(npm --version), runner: ${RUNNER_OS}"
          echo "workflow sha: ${GITHUB_SHA}, ref: ${GITHUB_REF}, attempt: ${GITHUB_RUN_ATTEMPT}"
          echo "::endgroup::"

          echo "::group::Inputs at failure"
          echo "VERSION   : '${VERSION}'"
          echo "PR_NUMBER : '${PR_NUMBER}'"
          echo "PR_AUTHOR : '${PR_AUTHOR}'"
          echo "PR_TITLE  : ${#PR_TITLE} chars"
          printf 'PR_TITLE  : %s\n' "${PR_TITLE}"
          echo "PR_BODY   : ${#PR_BODY} chars, first 500:"
          printf '%s\n' "${PR_BODY:0:500}"
          echo "::endgroup::"

          echo "::group::Repository state"
          echo "manifest version: $(node -p "require('./manifest.json').version" 2>&1)"
          git --no-pager status --short
          git --no-pager diff --stat
          echo "--- CHANGELOG.md, first 40 lines ---"
          head -40 CHANGELOG.md 2>&1 || echo "(CHANGELOG.md unreadable)"
          echo "::endgroup::"

          {
            echo "### Stage 2 (Build) failed"
            echo ""
            echo "- Version: \`${VERSION:-unset}\`"
            echo "- PR: #${PR_NUMBER:-unset} by \`${PR_AUTHOR:-unset}\`"
            echo "- PR body: ${#PR_BODY} chars"
            echo ""
            echo "See the \`Build diagnostics on failure\` step for full state."
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # STAGE 3: DISTRIBUTE
  # Announce the build on external services (Google Drive and Redmine).
  # These are announcements, not the release itself: a Drive or Redmine outage
  # must never stop the version bump, tag and GitHub release from happening, so
  # every external call here is allowed to fail and is reported instead.
  # =============================================================================
  distribute:
    name: "Stage 3: Distribute"
    needs: build
    runs-on: ubuntu-latest

    outputs:
      drive_link: ${{ steps.upload_drive.outputs.drive_link }}
      drive_status: ${{ steps.status.outputs.drive }}
      news_status: ${{ steps.status.outputs.news }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Check distribution secrets
        id: secrets
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          REDMINE_SERVER_URL: ${{ secrets.REDMINE_SERVER_URL }}
          REDMINE_PROJECT_ID: ${{ secrets.REDMINE_PROJECT_ID }}
        run: |
          # The scripts exit 1 on missing configuration. Decide here instead, so
          # an unconfigured service reads as "skipped" rather than "broken".
          if [ -n "${GOOGLE_DRIVE_CREDENTIALS}" ] && [ -n "${GOOGLE_DRIVE_FOLDER_ID}" ]; then
            echo "have_drive=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_drive=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_DRIVE_CREDENTIALS/GOOGLE_DRIVE_FOLDER_ID not set - skipping Drive upload"
          fi

          if [ -n "${REDMINE_API_KEY}" ] && [ -n "${REDMINE_SERVER_URL}" ] && [ -n "${REDMINE_PROJECT_ID}" ]; then
            echo "have_redmine=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_redmine=false" >> "$GITHUB_OUTPUT"
            echo "::warning::REDMINE_* secrets not set - skipping Redmine news"
          fi

      - name: Upload to Google Drive
        id: upload_drive
        if: steps.secrets.outputs.have_drive == 'true'
        continue-on-error: true
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DEBUG: 'true'
          ZIP_FILE: ${{ needs.build.outputs.zip_file }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "::group::Upload inputs"
          echo "node: $(node --version), npm: $(npm --version)"
          echo "zip: '${ZIP_FILE}' ($(stat -c %s "${ZIP_FILE}" 2>/dev/null || echo 'missing') bytes)"
          echo "folder id: ${#GOOGLE_DRIVE_FOLDER_ID} chars, credentials: ${#GOOGLE_DRIVE_CREDENTIALS} chars"
          echo "::endgroup::"

          node .github/scripts/upload-to-drive.js "${ZIP_FILE}" "${VERSION}"

          if [ -f drive-link.txt ]; then
            DRIVE_LINK=$(cat drive-link.txt)
            echo "drive_link=${DRIVE_LINK}" >> "$GITHUB_OUTPUT"
            echo "Google Drive link: ${DRIVE_LINK}"
          else
            echo "::error::upload-to-drive.js exited 0 without writing drive-link.txt"
            exit 1
          fi

      - name: Create Redmine news
        id: create_news
        if: steps.secrets.outputs.have_redmine == 'true'
        continue-on-error: true
        env:
          REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
          REDMINE_SERVER_URL: ${{ secrets.REDMINE_SERVER_URL }}
          REDMINE_PROJECT_ID: ${{ secrets.REDMINE_PROJECT_ID }}
          VERSION: ${{ needs.build.outputs.version }}
          DRIVE_LINK: ${{ steps.upload_drive.outputs.drive_link }}
        run: |
          node .github/scripts/create-redmine-news.js "${VERSION}" "${DRIVE_LINK}"

      - name: Distribution status
        id: status
        if: always()
        env:
          DRIVE_OUTCOME: ${{ steps.upload_drive.outcome }}
          NEWS_OUTCOME: ${{ steps.create_news.outcome }}
        run: |
          # outcome is '' when the step never ran under its own `if`.
          echo "drive=${DRIVE_OUTCOME:-skipped}" >> "$GITHUB_OUTPUT"
          echo "news=${NEWS_OUTCOME:-skipped}" >> "$GITHUB_OUTPUT"

          if [ "${DRIVE_OUTCOME}" = "failure" ] || [ "${NEWS_OUTCOME}" = "failure" ]; then
            echo "::warning::Distribution was degraded - the release itself still proceeds"
          fi

      - name: Stage Summary
        if: always()
        env:
          DRIVE_STATUS: ${{ steps.status.outputs.drive }}
          NEWS_STATUS: ${{ steps.status.outputs.news }}
          DRIVE_LINK: ${{ steps.upload_drive.outputs.drive_link }}
        run: |
          {
            echo "## Stage 3: Distribute"
            echo "- Google Drive: \`${DRIVE_STATUS:-unknown}\`${DRIVE_LINK:+ - ${DRIVE_LINK}}"
            echo "- Redmine news: \`${NEWS_STATUS:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # STAGE 4: PUBLISH
  # Commit the version bump and changelog, tag, and create the GitHub release.
  # Runs even when Stage 3 was degraded - only a failed build blocks it.
  # =============================================================================
  publish:
    name: "Stage 4: Publish"
    needs: [prepare, build, distribute]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Explicitly main, at its current tip, so the release commit lands on
          # top of whatever is there now rather than on the run's trigger SHA.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Check the release version
        id: version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "::error::Stage 2 produced no version - nothing to publish"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            # A re-run of an already-published release, or a version collision.
            # Either way, don't create a second tag for it.
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::tag v${VERSION} already exists - the release will be updated in place, not re-tagged"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Publishing v${VERSION}"

      - name: Commit version changes
        id: commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet -- manifest.json CHANGELOG.md; then
            echo "::notice::manifest.json and CHANGELOG.md already match main - nothing to commit"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add manifest.json CHANGELOG.md
          git commit -m "chore: release v${VERSION} [skip ci]" \
            -m "Auto-generated by release workflow" \
            -m "PR #${PR_NUMBER}: ${PR_TITLE}"

          # main can move while a release is in flight. Rebase onto it and retry
          # instead of force-pushing over whatever landed there.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed the release commit (attempt ${attempt})"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::notice::push rejected on attempt ${attempt}; rebasing onto origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::The release commit conflicts with main (usually CHANGELOG.md vs a concurrent release). Resolve on main, then re-run this job."
              exit 1
            fi
            sleep $(( attempt * 3 ))
          done

          echo "::error::Could not push the release commit after 5 attempts"
          exit 1

      - name: Compose release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DRIVE_STATUS: ${{ needs.distribute.outputs.drive_status }}
          DRIVE_LINK: ${{ needs.distribute.outputs.drive_link }}
          NEWS_STATUS: ${{ needs.distribute.outputs.news_status }}
          REDMINE_SERVER_URL: ${{ secrets.REDMINE_SERVER_URL }}
          REDMINE_PROJECT_ID: ${{ secrets.REDMINE_PROJECT_ID }}
        run: |
          # Written with printf from the environment, never interpolated into
          # the shell, so backticks and quotes in the PR body stay literal.
          {
            printf '## Cred Issue Reporter v%s\n\n' "${VERSION}"
            printf '### Changes\n%s\n\n' "${PR_TITLE}"
            printf '%s\n\n' "${PR_BODY}"
            printf '### Downloads\n'
            printf -- '- Chrome Extension ZIP: attached to this release\n'
            if [ "${DRIVE_STATUS}" = "success" ] && [ -n "${DRIVE_LINK}" ]; then
              printf -- '- [Google Drive copy](%s)\n' "${DRIVE_LINK}"
            else
              printf -- '- Google Drive copy: _%s_\n' "${DRIVE_STATUS:-skipped}"
            fi
            if [ "${NEWS_STATUS}" = "success" ] && [ -n "${REDMINE_SERVER_URL}" ]; then
              printf -- '- [Redmine announcement](%s/projects/%s/news)\n' "${REDMINE_SERVER_URL}" "${REDMINE_PROJECT_ID}"
            else
              printf -- '- Redmine announcement: _%s_\n' "${NEWS_STATUS:-skipped}"
            fi
            printf '\n---\nMerged PR #%s by @%s\n' "${PR_NUMBER}" "${PR_AUTHOR}"
          } > release-notes.md

          echo "::group::release-notes.md"
          cat release-notes.md
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: "Release v${{ needs.build.outputs.version }}"
          body_path: release-notes.md
          files: |
            ${{ needs.build.outputs.zip_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final Summary
        if: always()
        env:
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_TYPE: ${{ needs.prepare.outputs.version_type }}
          ZIP_FILE: ${{ needs.build.outputs.zip_file }}
          DRIVE_STATUS: ${{ needs.distribute.outputs.drive_status }}
          DRIVE_LINK: ${{ needs.distribute.outputs.drive_link }}
          NEWS_STATUS: ${{ needs.distribute.outputs.news_status }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          {
            echo "## Release v${VERSION}"
            echo ""
            echo "- Bump type: **${VERSION_TYPE}**"
            echo "- Release commit: \`${RELEASE_SHA:-not pushed}\`"
            echo "- Extension ZIP: \`${ZIP_FILE}\`"
            echo "- GitHub release: [v${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION})"
            echo "- Google Drive: \`${DRIVE_STATUS:-unknown}\`${DRIVE_LINK:+ - ${DRIVE_LINK}}"
            echo "- Redmine news: \`${NEWS_STATUS:-unknown}\`"
            echo ""
            if [ "${DRIVE_STATUS}" != "success" ] || [ "${NEWS_STATUS}" != "success" ]; then
              echo "> Distribution was degraded. The version bump, tag and GitHub release are done;"
              echo "> re-run **Stage 3: Distribute** once the external service is back."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
